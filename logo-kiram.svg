<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="venusGradLogo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD26F" />
      <stop offset="70%" style="stop-color:#BA7E2E" />
      <stop offset="100%" style="stop-color:#F4A000" />
    </radialGradient>
    <filter id="glowLogo">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Venus planet -->
  <circle cx="100" cy="100" r="60" fill="url(#venusGradLogo)" filter="url(#glowLogo)" />
  
  <!-- Atmospheric rings -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#FFB800" stroke-width="2" opacity="0.4"/>
  
  <!-- K symbol formed by spacecraft trail -->
  <path d="M 140 60 L 140 140 M 140 100 L 170 70" stroke="#FFB800" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
